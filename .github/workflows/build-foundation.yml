name: Foundation integration
on:
  push:
    branches: [work/context-foundation]
    paths: [.github/workflows/build-foundation.yml]
permissions:
  contents: write
concurrency:
  group: foundation-integration
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/context-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply locally verified fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dev/finalize-foundation.py')
          p.write_text(p.read_text().replace('if new in text:', 'if new and new in text:'))
          PY
          python3 dev/finalize-foundation.py
      - name: Commit source and remove temporary builders
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extensions tests docs README.md
          git rm dev/build-foundation.py dev/prepare-build.py dev/finalize-foundation.py
          git commit -m 'fix: preserve the live queue and verify complete retention behavior'
          git push origin HEAD:work/context-foundation
      - run: npm ci
      - run: npm run test:plus
      - run: npm run lint
      - run: npm test
      - name: Preserve historical upstream evidence
        run: git diff --exit-code 1f739edab42f3ba34ec22c4fcf24c8b0a4ad9664 -- docs/fold_vs_compaction scripts/verify_pi_context_experiment.mjs scripts/lib/pi_context_attribution.mjs
