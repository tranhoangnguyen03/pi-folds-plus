name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and upstream history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install measured Pi runtime
        run: |
          pi_version="$(node -p "require('./package-lock.json').packages['node_modules/@earendil-works/pi-coding-agent'].version")"
          npm install --global --prefix "$HOME/.npm-global" \
            "@earendil-works/pi-coding-agent@$pi_version" --ignore-scripts --no-audit --no-fund

      - name: Install sandbox support for upstream experiment checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-all --share-net --dev /dev --proc /proc --ro-bind /usr /usr \
            --ro-bind-try /bin /bin --ro-bind-try /lib /lib --ro-bind-try /lib64 /lib64 \
            -- /usr/bin/true

      - name: Lint
        run: npm run lint

      - name: Focused Plus runtime checks
        run: npm run test:plus

      - name: Full runtime regression suite
        run: npm test

      - name: Keep historical measurements and their verifier unchanged
        run: |
          git diff --exit-code 1f739edab42f3ba34ec22c4fcf24c8b0a4ad9664 -- \
            docs/fold_vs_compaction scripts/verify_pi_context_experiment.mjs \
            scripts/lib/pi_context_attribution.mjs

      # Published upstream results bind exact runtime hashes. Verify them with
      # that runtime, rather than relabeling old measurements as Plus results.
      - name: Verify historical upstream experiment harness
        run: |
          baseline="$RUNNER_TEMP/pi-fold-4.3.0"
          git worktree add --detach "$baseline" 1f739edab42f3ba34ec22c4fcf24c8b0a4ad9664
          trap 'git worktree remove --force "$baseline"' EXIT
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          (cd "$baseline" && node scripts/verify_pi_context_experiment.mjs)
